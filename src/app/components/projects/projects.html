<section id="projects" class="container projects mt-5">
  <h2 class="mb-5">02. Projects</h2>

  <div 
    *ngFor="let project of projects" 
    class="project-row"
    [ngClass]="{ 'reverse': project.reverse }"
  >

    <!-- MEDIA -->
    <div class="project-media">

      <!-- VIDEO -->
      <iframe *ngIf="project.video" [src]="project.video"></iframe>

      <!-- CAROUSEL -->
      <div *ngIf="project.images" class="carousel">
        <img 
          [src]="project.images[project.currentIndex]" 
          class="carousel-img"
        >

        <button class="prev" (click)="prev(project)">‹</button>
        <button class="next" (click)="next(project)">›</button>
      </div>

    </div>

    <!-- TEXT -->
    <div class="project-text">
      <h3>{{ project.title }}</h3>
      <p>{{ project.description }}</p>

      <div class="tech-icons">
        <img *ngFor="let tech of project.technologies" [src]="tech">
      </div>

      <a *ngIf="project.link" [href]="project.link" target="_blank">
        {{ project.linkText }}
      </a>
    </div>

  </div>
</section>
